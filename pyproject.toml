[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wanchen-financial-rag"
version = "0.1.0"
description = "Hybrid RAG knowledge base for 2025 annual reports of ten Chinese snack-food companies"
keywords = [
  "rag",
  "financial-reports",
  "hybrid-search",
  "bm25",
  "qwen-embedding",
  "streamlit",
  "chinese-nlp",
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "jieba>=0.42.1",
  "numpy>=2.0",
  "openai>=2.0",
  "pandas>=2.2",
  "pdfplumber>=0.11",
  "pymupdf>=1.26",
  "pypdf>=6.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=5.0",
  "streamlit>=1.50",
  "torch>=2.8",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.12"]
test = ["pytest>=8.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
